# /etc/nginx/sites-available/supabase-gateway.conf  (symlink into sites-enabled)
#
# Loopback-only gateway for server-side code on this box (SUPABASE_INTERNAL_URL=http://127.0.0.1:8000
# in /opt/apps/makeatale-shared/.env.local) and for GoTrue's API_EXTERNAL_URL. Same routing as the
# public /supabase/ prefix in nginx-makeatale.conf, minus the prefix. Never exposed publicly.
server {
    listen 127.0.0.1:8000;
    server_name _;
    client_max_body_size 10M;

    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
