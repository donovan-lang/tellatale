# /etc/nginx/sites-available/makeatale.conf  (symlink into sites-enabled)
#
# Cloudflare (Donovan's personal account, makeatale.com zone) sits in front and terminates public
# TLS. Origin serves :80 and :443 (self-signed snakeoil until certbot can issue - it cannot before
# DNS points here). Cloudflare SSL mode must be "Full" (not "Full (strict)") until a real cert or a
# Cloudflare Origin cert is installed; then either is fine.
#
# staging.makeatale.internal is a non-public name for origin testing before DNS moves:
#   curl -H 'Host: staging.makeatale.internal' http://173.255.204.127/
#
# /supabase/* is the self-hosted Supabase gateway (replaces Kong): the browser bundle is built with
# NEXT_PUBLIC_SUPABASE_URL=https://makeatale.com/supabase, so supabase-js hits
# /supabase/auth/v1/... (GoTrue :9999) and /supabase/rest/v1/... (PostgREST :3001) same-origin.
# Realtime is not deployed; the realtime path 404s and supabase-js just keeps retrying quietly.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name makeatale.com www.makeatale.com staging.makeatale.internal;
    include snippets/snakeoil.conf;
    include snippets/bad-bots.conf;

    client_max_body_size 10M;
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # ---- Supabase gateway (same-origin) ----
    location /supabase/auth/v1/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
    location /supabase/rest/v1/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /supabase/ { return 404; }

    # ---- Next.js app ----
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
