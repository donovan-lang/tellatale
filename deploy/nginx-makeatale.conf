# /etc/nginx/sites-available/makeatale.conf — enable (symlink into sites-enabled) at cutover.
# Cloudflare terminates TLS in front (makeatale.com zone, Donovan's personal CF account).
# staging.makeatale.internal is a non-public name for origin testing:
#   curl -H 'Host: staging.makeatale.internal' http://127.0.0.1/
server {
    listen 80;
    server_name makeatale.com www.makeatale.com staging.makeatale.internal;

    client_max_body_size 10M;

    # Next static assets are content-hashed: cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
